# script-name: test_reuseport.py
# polarion-id:
# covers: https://tracker.ceph.com/issues/78118 / https://github.com/ceph/ceph/pull/70093
# scenario: allow_port_reuse=false with count_per_host=2 — ports must increment,
#           so_reuseport must be absent; still run S3 IO on a deployed endpoint
config:
  user_count: 1
  objects_count: 5
  objects_size_range:
    min: 5
    max: 15
  test_ops:
    allow_port_reuse: false
    count_per_host: 2
    rgw_frontend_port: 8100
    service_id: reuseport-qe-ctrl
    verify_so_reuseport: false
    verify_same_port_per_host: false
    perform_s3_io: true
    download_object: true
    delete_bucket_object: true
    cleanup_service: true
    wait_timeout: 300
