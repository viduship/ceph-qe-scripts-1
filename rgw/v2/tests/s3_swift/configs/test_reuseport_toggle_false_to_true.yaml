# script-name: test_reuseport.py
# polarion-id:
# covers: https://tracker.ceph.com/issues/78118 / https://github.com/ceph/ceph/pull/70093
# scenario: deploy with allow_port_reuse=false (ports increment), then toggle
#           allow_port_reuse=true on the SAME service via orch apply.
#           ALL daemons must get so_reuseport=1 and share the base port
#           without requiring a manual `ceph orch redeploy`.
config:
  user_count: 1
  objects_count: 3
  objects_size_range:
    min: 5
    max: 15
  test_ops:
    allow_port_reuse: false
    toggle_allow_port_reuse: true
    count_per_host: 2
    rgw_frontend_port: 8300
    service_id: reuseport-qe-toggle-ft
    verify_so_reuseport: true
    verify_same_port_per_host: true
    perform_s3_io: false
    perform_s3_io_after_toggle: true
    download_object: true
    delete_bucket_object: true
    cleanup_service: true
    wait_timeout: 300
    toggle_settle_secs: 30
    toggle_wait_timeout: 240
    toggle_poll_secs: 15
