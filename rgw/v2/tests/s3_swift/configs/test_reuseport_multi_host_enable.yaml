# script-name: test_reuseport_edge.py
# covers: PR #70093 docs multi-host example / schedule.use_same_port
# scenario: count_per_host=2 on two hosts, allow_port_reuse=true
# expected: each host shares port; so_reuseport=1; S3 IO works
config:
  user_count: 1
  objects_count: 3
  objects_size_range:
    min: 5
    max: 15
  test_ops:
    scenario: multi_host_enable
    allow_port_reuse: true
    count_per_host: 2
    rgw_frontend_port: 8720
    service_id: reuseport-edge-mh
    placement_hosts:
      - ceph11
      - ceph12
    rgw_realm: india
    rgw_zonegroup: shared
    rgw_zone: primary
    disable_multisite_sync_traffic: true
    perform_s3_io: true
    download_object: true
    delete_bucket_object: true
    cleanup_service: true
    wait_timeout: 360
    port_wait_timeout: 180
