# script-name: test_reuseport_edge.py
# covers: PR #70093 skip_port_check is per-service
# scenario: two independent RGW services, both allow_port_reuse=true, same port
# expected: second service must NOT both run on the same port (ops footgun / bug)
config:
  user_count: 1
  objects_count: 1
  objects_size_range:
    min: 5
    max: 10
  test_ops:
    scenario: cross_service_same_port
    allow_port_reuse: true
    count_per_host: 2
    rgw_frontend_port: 8710
    service_id_a: reuseport-edge-a
    service_id_b: reuseport-edge-b
    rgw_realm: india
    rgw_zonegroup: shared
    rgw_zone: primary
    disable_multisite_sync_traffic: true
    perform_s3_io: false
    cleanup_service: true
    wait_timeout: 300
    second_service_settle_secs: 45
    second_service_wait: 150
    port_wait_timeout: 120
