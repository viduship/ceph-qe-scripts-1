# script-name: test_reuseport_edge.py
# covers: PR #70093 prepare_create append order
# scenario: allow_port_reuse=true AND rgw_frontend_extra_args has so_reuseport=0
# expected: no conflicting so_reuseport=1 and =0 in the same frontend string;
#           coherent policy matching allow_port_reuse
config:
  user_count: 1
  objects_count: 1
  objects_size_range:
    min: 5
    max: 10
  test_ops:
    scenario: extra_args_frontend
    frontend_assert: no_conflict
    allow_port_reuse: true
    count_per_host: 2
    rgw_frontend_port: 8705
    service_id: reuseport-edge-conflict
    rgw_frontend_extra_args:
      - so_reuseport=0
    rgw_realm: india
    rgw_zonegroup: shared
    rgw_zone: primary
    disable_multisite_sync_traffic: true
    perform_s3_io: false
    cleanup_service: true
    wait_timeout: 300
    force_redeploy_after_apply: true
