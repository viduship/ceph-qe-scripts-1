# Script: test_cors_noconf_get_origin.py
# Put CORS on the bucket, then curl GET/download with Origin.
# polarion id: CEPH-83632950
config:
  user_count: 1
  bucket_count: 1
  objects_count: 1
  objects_size_range:
    min: 1M
    max: 2M
  user_remove: true
  test_ops:
    tool: aws
    delete_bucket: true
    object_name: testfile
    origin: test
    steps:
      - set_cors
      - curl_get_with_origin
    cors_configuration:
      CORSRules:
        - AllowedOrigins: ["*"]
          AllowedMethods: ["GET"]
          AllowedHeaders: ["*"]
