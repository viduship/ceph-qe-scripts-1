# Script: test_cors_options_preflight.py
# CEPH-83632921: multi-rule CORS OPTIONS (same origin, GET then PUT)
config:
  user_count: 1
  bucket_count: 1
  objects_count: 0
  objects_size_range:
    min: 1
    max: 3
  user_remove: true
  test_ops:
    delete_bucket: true
    policy_document:
      CORSRules:
        - AllowedOrigins: ["https://app.example"]
          AllowedMethods: ["GET"]
          AllowedHeaders: ["*"]
        - AllowedOrigins: ["https://app.example"]
          AllowedMethods: ["PUT"]
          AllowedHeaders: ["*"]
    preflight_checks:
      - name: put_same_origin_later_rule
        origin: "https://app.example"
        method: "PUT"
        request_headers: "content-type"
        expected_status: 200
      - name: get_allowed_origin
        origin: "https://app.example"
        method: "GET"
        expected_status: 200
      - name: put_disallowed_origin
        origin: "https://other.example"
        method: "PUT"
        expected_status: 403
